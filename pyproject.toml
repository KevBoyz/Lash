[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lash"
version = "1.3.1.3"
description = "CLI tools package to desktop"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Pontes", email = "kevboyz@pm.me" }]
requires-python = ">=3.12"
keywords = [
    "toolkit", "keylogger", "auto-clicker", "zip", "organize", "files",
    "file-handler", "os", "random", "schedule", "spy", "crypt", "encrypt",
    "system", "utility", "images", "cli", "utilities", "wikipedia",
    "youtube", "music", "email", "github", "audio", "video",
    "screen-recorder", "macro", "automation", "device", "monitor",
    "calculator", "productivity", "news", "rss", "web-scraping", "crawler",
    "remote", "tasks", "calendar", "multimedia", "security", "hacking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "click>=8.1.3",
    "rich>=12.6.0"
    ]

[project.optional-dependencies]
all = [
    "rich>=12.6.0",
    "pyzipper>=0.3.6",
    "Pillow>=9.3.0",
    "tqdm>=4.64.1",
    "opencv-python>=4.6.0.66",
    "numpy>=1.23.4",
    "mss>=7.0.1",
    "moviepy>=1.0.3",
    "pyautogui>=0.9.53",
    "keyboard>=0.13.5",
    "bs4>=0.0.1",
    "requests>=2.28.0",
    "wikipedia>=1.4.0",
    "yt-dlp>=2024.1.0",
    "gnews>=0.3.0",
    "pyaes>=1.6.1",
    "pynput>=1.7.6",
    "matplotlib>=3.6.1",
    "PyQt5>=5.15.0",
    "psutil>=5.9.3",
    "dashing>=0.1.0",
    "plyer>=2.1.0",
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/KevBoyz/Lash"
Documentation = "https://kevboyz.github.io/KevBoyz-Docs/sub-pages/documentations/lash/index.html"

[project.scripts]
lash = "lash:Global"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["manifest.json"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.1.1",
]
