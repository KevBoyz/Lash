<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lash share</title>
<style>
  :root {
    --bg: #000000;
    --fg: #00ff41;
    --dim: #008f11;
    --err: #ff3b3b;
    --line: #003b0f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 15px;
  }
  body { overflow-x: hidden; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1, h2 { font-weight: normal; text-shadow: 0 0 6px rgba(0, 255, 65, .5); }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .notice {
    border: 1px dashed var(--fg);
    padding: 2px 8px;
    margin-left: 12px;
    font-size: .6em;
    vertical-align: middle;
    white-space: nowrap;
  }
  .actions { display: flex; gap: 12px; }
  button {
    flex: 1;
    min-height: 48px;
    padding: 8px 12px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--fg);
    font: inherit;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
  button:disabled { opacity: .4; cursor: wait; }
  #status { min-height: 1.4em; margin: 12px 0 0; color: var(--dim); word-break: break-all; }
  #status.err { color: var(--err); }
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "devices" "files" "log" "qr";
    gap: 16px;
  }
  section { border: 1px solid var(--dim); padding: 12px; min-width: 0; }
  .stack { display: grid; gap: 16px; min-width: 0; }
  #head { grid-area: head; min-width: 0; }
  #qr { grid-area: qr; display: block; width: 112px; height: 112px; justify-self: end; }
  #devices-box { grid-area: devices; }
  #log-box { grid-area: log; }
  #files-box { grid-area: files; }
  #log {
    height: 150px;
    overflow-y: auto;
    font-size: .85rem;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;  /* wrap at spaces; split a word only when it can't fit */
    text-shadow: 0 0 4px rgba(0, 255, 65, .35);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--line); word-break: break-all; }
  li:first-child { border-top: none; }
  .meta { color: var(--dim); font-size: .85rem; }
  .empty { color: var(--dim); }
  @media (min-width: 900px) {
    .grid {
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto;  /* wide left: log lines fit */
      grid-template-rows: auto auto 1fr;
      grid-template-areas:
        "head    head  qr"
        "devices files files"
        "log     files files";
      align-items: start;
    }
    #qr { margin-top: 8px; }  /* lines up with the title; shorter than the header */
    #log { height: 180px; }
    .actions { max-width: 520px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div id="head">
      <h1>&gt; lash share<span class="cursor">_</span><span id="p2p-notice" class="notice" hidden>p2p mode</span></h1>
      <div class="actions">
        <button id="send-files" type="button">[ send files ]</button>
        <button id="send-folder" type="button" hidden>[ send folder ]</button>
      </div>
      <input id="file-input" type="file" multiple hidden>
      <input id="folder-input" type="file" webkitdirectory multiple hidden>
      <div id="status" role="status"></div>
    </div>
    <img id="qr" src="/qr.svg" alt="QR code of this page" onerror="this.hidden = true">
    <section id="devices-box">
      <h2>// connected devices</h2>
      <ul id="devices"></ul>
    </section>
    <section id="log-box">
      <h2>// server log</h2>
      <div id="log"></div>
    </section>
    <div id="files-box" class="stack">
      <section>
        <h2>// available files</h2>
        <ul id="available"></ul>
      </section>
      <section>
        <h2>// my uploads</h2>
        <ul id="uploads"></ul>
      </section>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';

  const POLL_MS = 2000;
  const RETRY_MS = 75000;
  const DOWNLOAD_GAP_MS = 700;
  const TOO_BIG = 'folder too big (max 4 GB / 65535 files)';
  const TYPE_MS = 20;          // log typing: base delay per character...
  const TYPE_JITTER_MS = 45;   // ...plus a random part, like someone typing
  const LINE_PAUSE_MS = 300;
  const LOG_LINES = 200;
  const TYPE_LAST = 3;         // when the page opens, older log lines show at once
  const PAGE = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  let state = null;
  let offline = false;
  let busy = false;
  let draining = false;
  const inflight = new Map();     // file id -> time of the last download attempt
  const queue = [];               // files waiting to be downloaded
  const offers = new Map();       // p2p host: file id -> {name, blob}
  const handledPulls = new Set(); // p2p host: transfers already being sent
  const logQueue = [];            // log lines waiting to be typed
  let lastLog = 0;
  let logReady = false;
  let typing = false;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '_';

  // ---------- helpers ----------

  function formatSize(size) {
    if (size < 1024) return size + ' B';
    let value = size;
    for (const unit of ['KB', 'MB', 'GB']) {
      value /= 1024;
      if (value < 1024) return value.toFixed(1) + ' ' + unit;
    }
    return (value / 1024).toFixed(1) + ' TB';
  }

  function setStatus(text, isError) {
    $('status').textContent = text;
    $('status').classList.toggle('err', !!isError);
  }

  const isHostP2p = () => !!state && state.mode === 'p2p' && !!state.me && state.me.host;

  // ---------- rendering ----------

  function row(main, meta) {
    const li = document.createElement('li');
    const name = document.createElement('div');
    name.textContent = main;
    li.appendChild(name);
    if (meta) {
      const info = document.createElement('div');
      info.className = 'meta';
      info.textContent = meta;
      li.appendChild(info);
    }
    return li;
  }

  function fill(id, rows) {
    if (!rows.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '-- empty --';
      rows = [li];
    }
    $(id).replaceChildren(...rows);
  }

  function fileStatus(file) {
    if (file.downloaded) return '✓ downloaded';
    return inflight.has(file.id) ? 'downloading…' : 'pending';
  }

  function render(s) {
    fill('devices', s.devices.map((d) => row(d.name + (d.me ? ' (you)' : ''), d.ip)));
    fill('available', s.available.map((f) =>
      row(f.name, [formatSize(f.size), 'from ' + f.from, fileStatus(f)].join(' · '))));
    fill('uploads', s.uploads.map((f) =>
      row(f.name, formatSize(f.size) + ' · ' + f.downloads + ' download(s)')));
    $('p2p-notice').hidden = !isHostP2p();
  }

  // ---------- server log, typed like a terminal ----------

  function writeLog(change) {
    const log = $('log');
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    change(log);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  function addLogLine(text) {
    const line = document.createElement('div');
    line.append(text, cursor);
    writeLog((log) => {
      log.appendChild(line);
      while (log.childElementCount > LOG_LINES) log.firstElementChild.remove();
    });
    return line.firstChild;
  }

  function showLogs(logs) {
    const fresh = logs.filter((entry) => entry.id > lastLog); // polls can overlap
    if (fresh.length) lastLog = fresh[fresh.length - 1].id;
    const lines = fresh.map((entry) => entry.text);
    if (!logReady) {
      logReady = true;
      lines.splice(0, lines.length - TYPE_LAST).forEach((text) => addLogLine(text));
    }
    logQueue.push(...lines);
    typeLogs();
  }

  async function typeLogs() {
    if (typing) return;
    typing = true;
    while (logQueue.length) {
      const text = logQueue.shift();
      const node = addLogLine('');
      let typed = 0;
      while (typed < text.length) {
        // Type faster when lines pile up, so the log never falls behind.
        const backlog = text.length - typed + logQueue.reduce((n, t) => n + t.length, 0);
        typed = Math.min(text.length, typed + Math.max(1, Math.floor(backlog / 200)));
        const shown = text.slice(0, typed);
        writeLog(() => { node.data = shown; });
        await sleep(TYPE_MS + Math.random() * TYPE_JITTER_MS);
      }
      await sleep(LINE_PAUSE_MS);
    }
    typing = false;
  }

  // ---------- polling + automatic downloads ----------

  async function poll() {
    try {
      const res = await fetch('/api/state?page=' + PAGE + '&log=' + lastLog, {cache: 'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state = await res.json();
      if (offline) {
        offline = false;
        setStatus('');
      }
      scheduleDownloads(state.available);
      render(state);
      showLogs(state.logs || []);
      if (isHostP2p()) servePulls(state.pulls || []);
    } catch (err) {
      offline = true;
      setStatus('offline — trying to reconnect', true);
    }
  }

  async function pollLoop() {
    await poll();
    setTimeout(pollLoop, POLL_MS);
  }

  function scheduleDownloads(available) {
    const now = Date.now();
    for (const file of available) {
      if (file.downloaded) {
        inflight.delete(file.id);
        continue;
      }
      const last = inflight.get(file.id);
      if (last !== undefined && now - last < RETRY_MS) continue;
      inflight.set(file.id, now);
      queue.push(file);
    }
    drainDownloads();
  }

  async function drainDownloads() {
    if (draining) return;
    draining = true;
    while (queue.length) {
      const file = queue.shift();
      const link = document.createElement('a');
      link.href = '/api/files/' + encodeURIComponent(file.id);
      link.download = file.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      await sleep(DOWNLOAD_GAP_MS);
    }
    draining = false;
  }

  // ---------- sending ----------

  function put(url, body, label) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', url);
      xhr.upload.onprogress = (ev) => {
        if (ev.lengthComputable) {
          setStatus('sending ' + label + ' ' + Math.floor(ev.loaded * 100 / ev.total) + '%');
        }
      };
      xhr.onload = () => resolve(xhr.status);
      xhr.onerror = () => resolve(0);
      xhr.send(body);
    });
  }

  async function upload(name, blob) {
    const status = await put('/api/upload?name=' + encodeURIComponent(name), blob, name);
    if (status >= 200 && status < 300) {
      setStatus('sent: ' + name);
      return;
    }
    const p2p = !!state && state.mode === 'p2p';
    if (status === 504 || (p2p && status === 0)) throw new Error('PC offline');
    throw new Error('failed to send ' + name + (status ? ' (HTTP ' + status + ')' : ''));
  }

  async function offer(name, blob) {
    const url = '/api/offer?name=' + encodeURIComponent(name) +
      '&size=' + blob.size + '&page=' + PAGE;
    const res = await fetch(url, {method: 'POST'});
    if (!res.ok) throw new Error('failed to share ' + name + ' (HTTP ' + res.status + ')');
    const info = await res.json();
    offers.set(info.id, {name, blob});
    setStatus('shared: ' + name);
  }

  async function send(entries) {
    for (const {name, blob} of entries) {
      if (isHostP2p()) await offer(name, blob);
      else await upload(name, blob);
      await poll();
    }
  }

  function servePulls(pulls) {
    for (const pull of pulls) {
      if (handledPulls.has(pull.transfer)) continue;
      handledPulls.add(pull.transfer);
      const entry = offers.get(pull.file);
      if (!entry) continue;
      put('/api/relay/' + encodeURIComponent(pull.transfer), entry.blob, entry.name)
        .then((status) => {
          if (status < 200 || status >= 300) setStatus('failed to send ' + entry.name, true);
        });
    }
  }

  async function exclusive(task) {
    if (busy) return;
    busy = true;
    $('send-files').disabled = true;
    $('send-folder').disabled = true;
    try {
      await task();
    } catch (err) {
      setStatus(err.message || String(err), true);
    } finally {
      busy = false;
      $('send-files').disabled = false;
      $('send-folder').disabled = false;
    }
  }

  // ---------- zip (STORE, no compression, built in the browser) ----------

  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();

  async function crc32(file) {
    let crc = 0xFFFFFFFF;
    const reader = file.stream().getReader();
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      for (let i = 0; i < value.length; i++) {
        crc = CRC_TABLE[(crc ^ value[i]) & 0xFF] ^ (crc >>> 8);
      }
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime(ms) {
    const d = new Date(ms);
    if (d.getFullYear() < 1980) return {time: 0, date: (1 << 5) | 1};
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
    };
  }

  async function buildZip(files) {
    if (files.length > 0xFFFF) throw new Error(TOO_BIG);
    const encoder = new TextEncoder();
    const body = [];
    const central = [];
    let offset = 0;
    let centralSize = 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setStatus('building zip ' + (i + 1) + '/' + files.length);
      const name = encoder.encode(file.webkitRelativePath || file.name);
      const crc = await crc32(file);
      const {time, date} = dosDateTime(file.lastModified);

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true);
      local.setUint16(8, 0, true);
      local.setUint16(10, time, true);
      local.setUint16(12, date, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, file.size, true);
      local.setUint32(22, file.size, true);
      local.setUint16(26, name.length, true);
      local.setUint16(28, 0, true);

      const header = new DataView(new ArrayBuffer(46));
      header.setUint32(0, 0x02014b50, true);
      header.setUint16(4, 20, true);
      header.setUint16(6, 20, true);
      header.setUint16(8, 0x0800, true);
      header.setUint16(10, 0, true);
      header.setUint16(12, time, true);
      header.setUint16(14, date, true);
      header.setUint32(16, crc, true);
      header.setUint32(20, file.size, true);
      header.setUint32(24, file.size, true);
      header.setUint16(28, name.length, true);
      header.setUint32(38, 0, true);
      header.setUint32(42, offset, true);

      body.push(local, name, file);
      central.push(header, name);
      offset += 30 + name.length + file.size;
      centralSize += 46 + name.length;
      if (offset + centralSize + 22 > 0xFFFFFFFF) throw new Error(TOO_BIG);
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);
    return new Blob([...body, ...central, end], {type: 'application/zip'});
  }

  // ---------- wiring ----------

  const ua = navigator.userAgent;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(ua) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  $('send-folder').hidden = isMobile || !('webkitdirectory' in document.createElement('input'));

  $('send-files').addEventListener('click', () => $('file-input').click());
  $('send-folder').addEventListener('click', () => $('folder-input').click());

  $('file-input').addEventListener('change', (ev) => {
    const files = Array.from(ev.target.files);
    ev.target.value = '';
    if (!files.length) return;
    exclusive(() => send(files.map((file) => ({name: file.name, blob: file}))));
  });

  $('folder-input').addEventListener('change', (ev) => {
    const files = Array.from(ev.target.files);
    ev.target.value = '';
    if (!files.length) return;
    const folder = files[0].webkitRelativePath.split('/')[0] || 'folder';
    exclusive(async () => {
      const blob = await buildZip(files);
      await send([{name: folder + '.zip', blob}]);
    });
  });

  render({devices: [], available: [], uploads: []});
  $('log').append(cursor);
  pollLoop();
})();
</script>
</body>
</html>
